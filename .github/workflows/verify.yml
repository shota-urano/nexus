# PR と main への push で、ローカルと同じ確かめ（npm ci の後に make verify。DD-09 5章）を回す。
# 秘密は使わない。テストに macOS の /usr/bin/plutil を使うもの（tests/13-release-deploy.test.ts）があるので、
# 本番と同じ macOS で動かす。Node.js の版は .nvmrc（package.json の engines と同じ番号）に合わせる。
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Node.js と SQLite の版を出す
        run: |
          node --version
          npm --version
          node -e 'const { DatabaseSync } = require("node:sqlite"); const db = new DatabaseSync(":memory:"); console.log("sqlite", db.prepare("select sqlite_version() as v").get().v)'
      - run: npm ci
      - run: make verify
      - name: テストの結果（junit）を残す
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: junit
          path: reports/junit.xml
          if-no-files-found: ignore
